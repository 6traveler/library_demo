<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>编辑图书</title>
    <link rel="stylesheet" href="/src/assets/base.css">
</head>
<body>
<section class="page">
    <div class="top-bar">
        <div>
            <h1>编辑图书</h1>
            <p class="page__subtitle">加载后可修改任意字段并保存</p>
        </div>
        <div class="top-bar__actions">
            <a class="btn btn-light" href="../book-list/bookListPage.html">返回列表</a>
            <button class="btn btn-light" id="reloadBtn">重新加载</button>
            <span class="user-pill" id="usernameText">未登录</span>
            <button class="btn btn-outline" id="logoutBtn">退出</button>
        </div>
    </div>
    <div class="card">
        <form id="editForm" class="book-form">
            <div class="form-grid">
                <label>书名<input type="text" name="bookName" required></label>
                <label>作者<input type="text" name="author" required></label>
                <label>ISBN<input type="text" name="ISBN"></label>
                <label>单价<input type="number" step="0.01" name="price" required></label>
                <label>数量<input type="number" min="0" name="count" required></label>
                <label>封面<input type="text" name="img" placeholder="/img/红楼梦.jpg"></label>
            </div>
            <label>内容简介<textarea name="content" rows="5"></textarea></label>
            <div class="actions">
                <button type="submit" class="btn btn-primary">保存修改</button>
                <button type="button" class="btn btn-outline" id="backBtn">取消</button>
            </div>
            <p class="status-text" id="statusText">正在加载图书...</p>
        </form>
    </div>
</section>
<script type="module" src="/src/pages/book-edit/book-edit-page.js"></script>
</body>
</html>
