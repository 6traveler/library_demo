<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图书列表</title>
    <link rel="stylesheet" href="/src/assets/base.css">
</head>
<body>
<section class="page">
    <div class="top-bar">
        <div>
            <h1>图书列表</h1>
            <p class="page__subtitle">查看数据库中所有图书，可跳转执行详情 / 编辑 / 删除</p>
        </div>
        <div class="top-bar__actions">
            <a class="btn btn-primary" href="../book-create/bookCreatePage.html">新增图书</a>
            <button class="btn btn-light" id="refreshBtn">刷新</button>
            <span class="user-pill" id="usernameText">未登录</span>
            <button class="btn btn-outline" id="logoutBtn">退出</button>
        </div>
    </div>
    <div class="card">
        <div class="status-text" id="statusText">正在加载图书数据...</div>
        <div class="tableDiv">
            <table>
                <thead>
                    <tr>
                        <th>编号</th>
                        <th>书名</th>
                        <th>作者</th>
                        <th>数量</th>
                        <th>单价（元）</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="listBody"></tbody>
            </table>
        </div>
    </div>
</section>
<script type="module" src="/src/pages/book-list/book-list-page.js"></script>
</body>
</html>
