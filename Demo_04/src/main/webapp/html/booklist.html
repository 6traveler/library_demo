<!DOCTYPE html>

    <title>图书列表</title>
</head>

<body>

    <p>图书列表</p>
</div>
<div class="tableDiv">
    <table class="table table-hover">
        <thead>
        <tr>
            <th>ID</th>
            <th>书名</th>
            <th>作者</th>
            <th>出版日期</th>
            <th>页数</th>
            <th>价格</th>
            <th>操作</th>
        </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<div class="pageDiv">
    <div class="row">
        <div class="col-md-6">
            <p class="text-left" id="pageInfo"></p>
        </div>
        <div class="col-md-6">
            <nav aria-label="Page navigation" id="nav_navigation"></nav>
        </div>
    </div>
</div>

<script src="../common/jquery.min.js"></script>
<script src="../common/bootstrap.min.js"></script>
